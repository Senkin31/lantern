<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Lantern</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #14213d);
      --hint: var(--tg-theme-hint-color, #6b7280);
      --accent: var(--tg-theme-button-color, #2481cc);
      --accent-text: var(--tg-theme-button-text-color, #ffffff);
      --card: var(--tg-theme-secondary-bg-color, #f2f4f7);
      --ok: #2e9d5b; --warn: #c77700; --bad: #d64545;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: var(--tg-theme-bg-color, #17212b); --text: var(--tg-theme-text-color, #f5f5f5);
        --hint: var(--tg-theme-hint-color, #8b98a5); --card: var(--tg-theme-secondary-bg-color, #232e3c); }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { padding: 12px 16px 24px; max-width: 520px; margin: 0 auto; }
    h1 { font-size: 18px; margin: 4px 0 2px; }
    .lead { color: var(--hint); margin: 0 0 12px; font-size: 14px; }
    .frame { position: relative; width: 100%; aspect-ratio: 3 / 4; max-height: 58vh; border-radius: 14px; overflow: hidden;
      background: #000; }
    .frame video, .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .frame .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center; color: #fff; font-size: 15px; }
    .shutter { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: 72px; height: 72px;
      border-radius: 50%; border: 5px solid rgba(255, 255, 255, .9); background: rgba(255, 255, 255, .35);
      cursor: pointer; }
    .shutter:active { background: rgba(255, 255, 255, .8); }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    button.btn { flex: 1; border: 0; border-radius: 10px; padding: 13px 14px; font: inherit; font-weight: 600;
      background: var(--accent); color: var(--accent-text); cursor: pointer; }
    button.btn.ghost { background: var(--card); color: var(--text); }
    button.btn:disabled { opacity: .5; }
    .loc { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--card); font-size: 14px; }
    .loc.ok { color: var(--ok); } .loc.warn { color: var(--warn); } .loc.bad { color: var(--bad); }
    .result { padding: 18px 16px; border-radius: 14px; background: var(--card); text-align: center; }
    .result .big { font-size: 40px; }
    .result .ticket { font-family: ui-monospace, monospace; font-size: 18px; font-weight: 700; margin-top: 6px; }
    .small { color: var(--hint); font-size: 13px; margin-top: 10px; }
    .diag { color: var(--hint); font: 11px/1.3 ui-monospace, monospace; margin-top: 6px; opacity: .7; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1 data-t="title">Ziņot par ietvi</h1>
    <p class="lead" data-t="lead">Nofotografē vietu tagad. Foto un tava atrašanās vieta aizies kopā.</p>

    <section id="shoot">
      <div class="frame">
        <video id="video" playsinline muted autoplay></video>
        <img id="preview" alt="" hidden>
        <div class="msg" id="cam-msg" data-t="cam_starting">Atver kameru…</div>
        <button class="shutter" id="shutter" type="button" aria-label="Take photo" hidden></button>
      </div>
      <div class="row" id="after-shot" hidden>
        <button class="btn ghost" id="retake" type="button" data-t="retake">Pārņemt</button>
        <button class="btn" id="send" type="button" data-t="send">Nosūtīt</button>
      </div>
      <div class="row" id="fallback-row" hidden>
        <button class="btn ghost" id="fallback" type="button" data-t="fallback">Izmantot tālruņa kameru</button>
        <input id="file" type="file" accept="image/*" capture="environment" hidden>
      </div>
      <div class="loc" id="loc" data-t="loc_wait">📍 Nosaka atrašanās vietu…</div>
      <div class="row" id="loc-row" hidden>
        <button class="btn ghost" id="loc-retry" type="button" data-t="loc_retry">Mēģināt vēlreiz</button>
      </div>
    </section>

    <section id="done" hidden>
      <div class="result">
        <div class="big" id="res-icon">✅</div>
        <div id="res-text"></div>
        <div class="ticket" id="res-ticket"></div>
      </div>
      <div class="row">
        <button class="btn" id="again" type="button" data-t="again" hidden>📸 Fotografēt vēlreiz</button>
        <button class="btn ghost" id="close" type="button" data-t="close">Aizvērt</button>
      </div>
    </section>

    <p class="small" data-t="privacy">Foto tiek uzņemts tikai šeit, galerija netiek izmantota. Atrašanās vietu ņemam tikai šim ziņojumam.</p>
    <p class="diag" id="diag"></p>
  </main>
  <script src="/assets/js/tg.js"></script>
</body>
</html>
